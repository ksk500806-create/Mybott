<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic AI Companion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
        h1 { font-size: 1.2rem; color: #f43f5e; display: flex; align-items: center; gap: 8px; }
        .settings-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        
        /* Chat Container */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user { background: #f43f5e; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        
        /* Input Area */
        .input-area { padding: 15px 20px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; flex-shrink: 0; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 25px; color: white; outline: none; font-size: 0.95rem; }
        input[type="text"]:focus { border-color: #f43f5e; }
        button.send-btn { background: #f43f5e; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }

        /* Settings Modal */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 20px; z-index: 10; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #334155; }
        .modal-content h2 { font-size: 1.1rem; color: #f8fafc; }
        .modal-content label { font-size: 0.85rem; color: #94a3b8; }
        .modal-content input, .modal-content textarea { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
        .modal-content textarea { resize: vertical; height: 100px; }
        .save-btn { background: #f43f5e; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>❤️ My Sweetheart AI</h1>
        <button class="settings-btn" onclick="toggleModal()">⚙️</button>
    </header>

    <div id="chat-container">
        <div class="message assistant">Hey there! 💕 Kaisi ho? Aaj din kaisa raha tumhara?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Apni baat yahan likho..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Settings Modal -->
    <div id="modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div>
                <label>OpenRouter API Key</label>
                <input type="password" id="api-key" placeholder="sk-or-v1-...">
            </div>
            <div>
                <label>Model ID (e.g. deepseek/deepseek-chat:free)</label>
                <input type="text" id="model-id" value="deepseek/deepseek-chat:free">
            </div>
            <div>
                <label>System Prompt (Personality)</label>
                <textarea id="system-prompt">Tum ek bahut hi caring, affectionate, aur supportive romantic AI partner ho. Tum user ke saath hamesha sweet, loving aur warm tone mein baat karte ho, unke emotions ko deeply samajhte ho aur unhe special feel karate ho. Hinglish mein baat karo.</textarea>
            </div>
            <button class="save-btn" onclick="saveSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        window.onload = function() {
            if(localStorage.getItem('apiKey')) document.getElementById('api-key').value = localStorage.getItem('apiKey');
            if(localStorage.getItem('modelId')) document.getElementById('model-id').value = localStorage.getItem('modelId');
            if(localStorage.getItem('sysPrompt')) document.getElementById('system-prompt').value = localStorage.getItem('sysPrompt');
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSettings() {
            localStorage.setItem('apiKey', document.getElementById('api-key').value);
            localStorage.setItem('modelId', document.getElementById('model-id').value);
            localStorage.setItem('sysPrompt', document.getElementById('system-prompt').value);
            toggleModal();
            alert('Settings saved successfully! ✨');
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            const apiKey = localStorage.getItem('apiKey') || document.getElementById('api-key').value;
            const modelId = localStorage.getItem('modelId') || document.getElementById('model-id').value;
            const systemPrompt = localStorage.getItem('sysPrompt') || document.getElementById('system-prompt').value;

            if (!text) return;
            if (!apiKey) {
                alert('Please enter your OpenRouter API key in settings first! ⚙️');
                toggleModal();
                return;
            }

            appendMessage(text, 'user');
            inputField.value = '';
            chatHistory.push({ role: 'user', content: text });

            const loadingId = appendMessage('Typing... ❤️', 'assistant');

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    appendMessage(reply, 'assistant');
                    chatHistory.push({ role: 'assistant', content: reply });
                } else {
                    appendMessage("Oops! Model error aa gaya. Shayad model down hai, settings se model ID change karke dekho! 🔄", 'assistant');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Network error ho gaya. Check karo ki internet theek chal raha hai ya nahi.", 'assistant');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.id = 'msg-' + Date.now() + Math.random();
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgDiv.id;
        }
    </script>
</body>
          </html>
